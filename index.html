  <!--
    media="print" evita que la hoja de Google Fonts bloquee el render; se pasa a
    "all" cuando termina de cargar. El cambio va en un <script> y no en un
    onload="" porque la CSP prohíbe manejadores inline (script-src-attr 'none').
  -->
  <link id="google-fonts"
    href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet" media="print">
  <script>
    (function () {
      var link = document.getElementById('google-fonts');
      if (!link) return;
      var apply = function () { link.media = 'all'; };
      // Puede haber cargado ya entre el <link> y este script.
      if (link.sheet) apply(); else link.addEventListener('load', apply);
    })();
  </script>

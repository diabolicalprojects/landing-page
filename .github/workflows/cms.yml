name: CMS

# El CMS (cms/ y compartido/) tiene su propio flujo: el del sitio no lo instala.
on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - 'compartido/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cms.yml'
  pull_request:
    paths:
      - 'cms/**'
      - 'compartido/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cms.yml'

concurrency:
  group: cms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      # Las pruebas corren también contra un Postgres 18 de verdad, además de
      # PGlite: el RLS y los permisos se validan en el motor de producción.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos (TypeScript estricto)
        run: npm run cms:tipos

      - name: Lint
        run: npm run cms:lint

      - name: Pruebas con PGlite
        run: npm run cms:test

      - name: Pruebas contra Postgres 18
        run: npm run test -w @diabolical/cms-api
        env:
          CMS_BASE_DATOS_PRUEBAS: postgres://postgres:pruebas@localhost:5432/cms

      - name: Build
        run: npm run cms:build

      # Chrome ya viene en el runner: Playwright no descarga navegadores.
      - name: E2E con Playwright
        run: npm run cms:e2e
        env:
          CI: 'true'

      - name: Informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cms
          path: cms/panel/test-results
          retention-days: 7

  imagen:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}-cms" >> "$GITHUB_OUTPUT"

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cms/Dockerfile
          load: true
          tags: cms-local:prueba
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

      - name: Verificar que el contenedor arranca y responde
        run: |
          docker run -d --name cms -p 3100:3100 \
            -e CMS_BASE_DATOS=pglite:memoria -e CMS_ORIGEN=http://localhost:3100 \
            --tmpfs /tmp cms-local:prueba
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/admin/api/salud > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/admin/api/salud
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/admin/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/admin/api/sesion)" = "401"
          curl -sI http://127.0.0.1:3100/admin/ | grep -qi "content-security-policy"
          docker logs cms

      - name: Publicar en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cms/Dockerfile
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:latest
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
          cache-from: type=gha,scope=cms

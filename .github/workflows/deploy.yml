name: Desplegar

# Dispara el despliegue en el servidor de producción y comprueba que la versión
# nueva quedó realmente servida.
#
# Requiere un único secreto: DEPLOY_WEBHOOK_URL, la URL de despliegue que expone
# tu plataforma (Coolify, Easypanel, Dokploy, Render, Railway... todas tienen
# una). Sin ese secreto el workflow no falla: avisa y no hace nada, así que se
# puede mergear antes de configurarlo.
#
# Se encadena a "Publicar imagen" para que el despliegue use una imagen que ya
# existe en el registro.

on:
  workflow_run:
    workflows: ["Publicar imagen"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Se construye aquí para saber qué debería estar sirviendo producción.
      # Sin esto no hay forma de distinguir la versión nueva de la anterior.
      - name: Construir el contenido esperado
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://diabolicalservices.tech' }}
        run: |
          npm ci
          npm run build

      - name: Comprobar si hay webhook configurado
        id: check
        env:
          WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Despliegue no configurado::Falta el secreto DEPLOY_WEBHOOK_URL. Añádelo en Settings → Secrets and variables → Actions y vuelve a lanzar este workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar el despliegue
        if: steps.check.outputs.configured == 'true'
        env:
          WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          RAMA: ${{ github.ref_name }}
        run: |
          # Dokploy deduce el proveedor por la cabecera y la rama por el cuerpo.
          # Un POST pelado devuelve {"message":"Branch Not Match"} con código 301,
          # y como 301 no es un error para `curl -f`, el paso daba verde sin haber
          # desplegado nada. De ahí que se compruebe el código a mano.
          # El paso corre con `bash -e`, así que un curl con salida distinta de
          # cero abortaría aquí mismo y el diagnóstico de abajo no llegaría a
          # imprimirse. Se captura su código en lugar de dejar que aborte.
          CODIGO=$(curl -sS --max-time 60 -o respuesta.json -w '%{http_code}' \
            -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            -d "{\"ref\":\"refs/heads/${RAMA}\"}" 2> error-curl.txt) || SALIDA_CURL=$?
          SALIDA_CURL=${SALIDA_CURL:-0}

          echo "curl salió con $SALIDA_CURL, HTTP ${CODIGO:-(sin respuesta)}"
          [ -s respuesta.json ] && { echo "respuesta:"; cat respuesta.json; echo; }
          [ -s error-curl.txt ] && { echo "stderr de curl:"; cat error-curl.txt; }

          if [ "$SALIDA_CURL" -ne 0 ]; then
            echo "::error title=No se pudo llamar al webhook::curl falló con código $SALIDA_CURL. Si es un 3 (URL mal formada), revisa que el secreto DEPLOY_WEBHOOK_URL no lleve espacios ni un salto de línea al final."
            exit 1
          fi

          case "$CODIGO" in
            2??) echo "Webhook aceptado." ;;
            *)
              echo "::error title=El webhook no aceptó la petición::Respondió $CODIGO en lugar de 2xx. Un 301 con 'Branch Not Match' significa que la rama enviada en el cuerpo no coincide con la configurada en la plataforma."
              exit 1
              ;;
          esac

      - name: Esperar a que la versión nueva esté en producción
        if: steps.check.outputs.configured == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://diabolicalservices.tech' }}
        run: |
          # Se compara contra llms.txt porque se genera por completo desde
          # sectores.json, faq.json y articulos.json: es determinista y cambia
          # con cualquier commit que toque el contenido publicado. La portada no
          # sirve: el servidor le inyecta el <head> desde data/settings.json, que
          # se edita desde /admin y no depende del commit.
          #
          # El chequeo anterior buscaba "</head>" y el ID de GTM, que ya estaban
          # en la versión vieja: pasaba en la primera vuelta siempre, incluso con
          # el contenedor anterior en pie. Justo el fallo que debía detectar.
          ESPERADO=dist/llms.txt
          if [ ! -s "$ESPERADO" ]; then
            echo "::error title=Build incompleto::No se generó $ESPERADO; no hay con qué comparar."
            exit 1
          fi

          echo "Comprobando $SITE_URL durante un máximo de 10 minutos..."
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$SITE_URL/llms.txt" -o servido.txt 2>/dev/null; then
              if cmp -s "$ESPERADO" servido.txt; then
                echo "Producción sirve el contenido de este commit (tras $((i * 15))s)."
                exit 0
              fi
            fi
            sleep 15
          done

          echo "::error title=El despliegue no llegó a producción::El webhook respondió, pero $SITE_URL sigue sin servir el contenido de este commit pasados 10 minutos. El contenedor anterior puede seguir en pie: revisa los logs de la plataforma."
          echo "--- Diferencias (esperado < / servido >) ---"
          diff "$ESPERADO" servido.txt | head -40 || true
          exit 1

      - name: Verificar que el despliegue quedó correcto
        if: steps.check.outputs.configured == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://diabolicalservices.tech' }}
        run: |
          FAILED=0

          # La API de escritura debe rechazar peticiones sin sesión. Se usa una
          # petición sin cuerpo: con la versión desplegada no escribe nada.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST "$SITE_URL/api/settings" -H 'Content-Type: application/json' -d '{}')
          if [ "$CODE" = "401" ] || [ "$CODE" = "503" ]; then
            echo "✓ POST /api/settings rechazado ($CODE)"
          else
            echo "::error::POST /api/settings devolvió $CODE; se esperaba 401 o 503."
            FAILED=1
          fi

          if curl -sI --max-time 20 "$SITE_URL/" | grep -qi 'content-security-policy'; then
            echo "✓ CSP activa"
          else
            echo "::error::No se está enviando la cabecera Content-Security-Policy."
            FAILED=1
          fi

          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/esta-ruta-no-existe")
          if [ "$CODE" = "404" ]; then
            echo "✓ Rutas desconocidas devuelven 404"
          else
            echo "::error::Una ruta inexistente devolvió $CODE; se esperaba 404."
            FAILED=1
          fi

          exit $FAILED

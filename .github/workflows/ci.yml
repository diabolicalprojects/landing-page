name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Las pruebas de humo levantan el servidor contra dist/, así que van
      # después del build.
      - name: Tests
        run: npm test

      # Informativo: una advisory nueva en una dependencia transitiva no debe
      # bloquear un PR sin relación, pero sí tiene que verse.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la imagen construye
        run: docker build -t diabolical-landing:ci .

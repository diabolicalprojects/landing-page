name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Las pruebas de humo levantan el servidor contra dist/, así que van
      # después del build.
      - name: Tests
        run: npm test

      # Informativo: una advisory nueva en una dependencia transitiva no debe
      # bloquear un PR sin relación, pero sí tiene que verse.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la imagen construye
        run: docker build -t diabolical-landing:ci .

      # Construir no basta: una dependencia que falte en la etapa de runtime
      # produce una imagen válida cuyo contenedor muere al arrancar. Cuando eso
      # pasa, el orquestador conserva el contenedor anterior y da el despliegue
      # por bueno, así que el sitio se queda en la versión vieja sin que nada
      # falle a la vista.
      - name: Verificar que el contenedor arranca y responde
        run: |
          docker run -d --name ci-check -p 3000:3000 \
            -e NODE_ENV=production diabolical-landing:ci

          OK=""
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "El servidor responde tras ${i}s."
              OK=1
              break
            fi
            sleep 1
          done

          if [ -z "$OK" ]; then
            echo "::error title=El contenedor no respondió::/health no contestó en 30 segundos."
            docker logs ci-check
            docker rm -f ci-check > /dev/null 2>&1 || true
            exit 1
          fi

          # Estas rutas dependen de ficheros que solo existen si la imagen los
          # copió: son las que delatan una etapa de runtime incompleta.
          #
          # Se cubre una de cada familia (portada, sector, servicio, página
          # suelta) porque cada una se sirve por un camino distinto, y los
          # cuatro ficheros generados, que son los que faltan cuando la etapa de
          # runtime se queda a medias.
          FALLOS=0
          for ruta in / /nosotros /sectores/clinicas /servicios/sitio-web /contacto /llms.txt /llms-full.txt /robots.txt /sitemap.xml; do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:3000$ruta")
            if [ "$CODIGO" = "200" ]; then
              echo "  OK $ruta"
            else
              echo "::error::$ruta devolvió $CODIGO; se esperaba 200."
              FALLOS=1
            fi
          done

          # Las direcciones de sector anteriores siguen indexadas en Google. Un
          # 404 tiraría a la basura lo que esas páginas hubieran ganado, así que
          # el 301 se comprueba aquí y no se descubre meses después en Search
          # Console.
          for ruta in /automatizacion-para-clinicas /automatizacion-para-spas; do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:3000$ruta")
            DESTINO=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 10 "http://127.0.0.1:3000$ruta")
            if [ "$CODIGO" = "301" ]; then
              echo "  OK $ruta -> $DESTINO"
            else
              echo "::error::$ruta devolvió $CODIGO; se esperaba 301."
              FALLOS=1
            fi
          done

          # Una ruta inventada tiene que devolver 404 de verdad. Un 200 con la
          # página vacía es un soft-404, y Google lo penaliza.
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:3000/esta-ruta-no-existe")
          if [ "$CODIGO" = "404" ]; then
            echo "  OK 404 en ruta desconocida"
          else
            echo "::error::Una ruta inexistente devolvió $CODIGO; se esperaba 404."
            FALLOS=1
          fi

          if [ "$FALLOS" = "1" ]; then docker logs ci-check; fi
          docker rm -f ci-check > /dev/null
          exit $FALLOS
